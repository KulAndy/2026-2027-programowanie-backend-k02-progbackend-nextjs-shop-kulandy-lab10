services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shoppass
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shopdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: shop_test
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shoppass
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop_test"]
      interval: 5s
      retries: 10

volumes:
  shopdata:
